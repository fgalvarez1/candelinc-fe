[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "candelinc-fe"
version = "0.1.0rc2"
description = "CANDELINC-FE: CP tensor decomposition with the acquisition mode constrained by a P1 finite element design matrix over variables."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Felipe Álvarez-Barrientos" },
    { name = "Martin Genet" },
]
keywords = ["tensor decomposition", "CP decomposition", "CANDELINC", "finite elements"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22",
    "tensorly>=0.5",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/fgalvarez1/candelinc-fe"
Issues = "https://github.com/fgalvarez1/candelinc-fe/issues"

[tool.setuptools]
packages = ["candelinc_fe"]
